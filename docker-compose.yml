version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-video-summarizer
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=your_secure_password
      - WEBHOOK_URL=https://your-domain.com/
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_MODE=regular
      - N8N_LOG_LEVEL=info
      - N8N_METRICS=true
      # Performance settings for video processing
      - N8N_PAYLOAD_DEFAULT_MAX_SIZE=16
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_TTL=24
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files
      - ./workflows:/home/node/.n8n/workflows
      - /tmp/n8n-video-processing:/tmp/video-processing
    networks:
      - n8n_network
    depends_on:
      - postgres
    command: >
      sh -c "
        apt-get update &&
        apt-get install -y ffmpeg &&
        n8n start
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:13
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_secure_password
      - POSTGRES_DB=n8n
      - POSTGRES_NON_ROOT_USER=n8n
      - POSTGRES_NON_ROOT_PASSWORD=n8n_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    container_name: n8n-redis
    restart: unless-stopped
    command: redis-server --requirepass your_redis_password
    volumes:
      - redis_data:/data
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: n8n-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - n8n_network
    depends_on:
      - n8n

  backup:
    image: alpine:latest
    container_name: n8n-backup
    restart: "no"
    volumes:
      - n8n_data:/backup/n8n
      - postgres_data:/backup/postgres
      - ./backups:/backups
    command: >
      sh -c "
        apk add --no-cache postgresql-client &&
        while true; do
          tar -czf /backups/n8n-backup-$(date +%Y%m%d_%H%M%S).tar.gz -C /backup .
          pg_dump -h postgres -U n8n -d n8n > /backups/postgres-backup-$(date +%Y%m%d_%H%M%S).sql
          find /backups -name '*.tar.gz' -mtime +7 -delete
          find /backups -name '*.sql' -mtime +7 -delete
          sleep 86400
        done
      "
    networks:
      - n8n_network
    depends_on:
      - postgres
    environment:
      - PGPASSWORD=n8n_secure_password

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  n8n_network:
    driver: bridge